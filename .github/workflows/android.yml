
name: Gerar APK Santanas

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estrutura
        run: |
          ls -la
          ls -la app

      
      - name: Diagnosticar projeto
  run: |
    echo "=== ARQUIVOS DO PROJETO ==="
    ls -la
    echo "=== CONFIGURACAO GRADLE ==="
    if [ -f settings.gradle.kts ]; then
      cat settings.gradle.kts
    elif [ -f settings.gradle ]; then
      cat settings.gradle
    else
      echo "Arquivo settings não encontrado"
    fi
    echo "=== PROJETOS GRADLE ==="
    gradle projects
    echo "=== TAREFAS DO APP ==="
    gradle :app:tasks --all

      - name: Gerar APK
        run: gradle :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Santana-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

